# Static PWA — Netlify Drop ready (no build step).
# Drag this folder onto https://app.netlify.com/drop

[build]
  publish = "."

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/apple-touch-icon-*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/apple-touch-icon-precomposed.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/icons/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600, must-revalidate"

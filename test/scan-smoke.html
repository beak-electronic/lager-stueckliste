<!DOCTYPE html>
<html><body>
<script src="/vendor/zxing-library.min.js"></script>
<img id="im" src="/samples/datamatrix-demo.png" />
<pre id="out">pending</pre>
<script type="module">
import { decodeDataMatrixFromElement } from "/js/scan.js";
import { extractSerialFromPayload } from "/js/sn.js";
const im = document.getElementById("im");
await new Promise((r,j)=>{ if(im.complete) r(); else { im.onload=r; im.onerror=j; }});
try {
  const text = await decodeDataMatrixFromElement(im);
  const sn = extractSerialFromPayload(text);
  const ok = text.includes("BS0180") && sn === "BS0180E01A21K0103";
  document.getElementById("out").textContent = (ok?"PASS":"FAIL") + "\n" + text + "\n" + sn;
  document.title = ok ? "PASS" : "FAIL";
} catch(e) {
  document.getElementById("out").textContent = "FAIL " + e;
  document.title = "FAIL";
}
</script>
</body></html>
